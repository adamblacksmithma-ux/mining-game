<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ล่าอูนา</title>
<style>
:root{--bg:#141a2e;--panel:#1d2540;--ink:#f3f1ea;--mute:#9aa3c0;--line:#33406b;--gold:#f2c230;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#e9eefc;--panel:#fff;--ink:#1a2038;--mute:#5a6486;--line:#c5cdea;--gold:#a87a08;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;padding:12px;max-width:820px;text-align:center}
h1{font-size:24px;margin:6px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
p,.mu{color:var(--mute);font-size:14px;margin:6px 0}
button{font:600 15px inherit;font-family:inherit;border-radius:12px;border:1px solid var(--line);background:rgba(127,127,127,.15);color:var(--ink);padding:10px 12px;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.p{background:linear-gradient(180deg,#ffb04a,#e0561f);border:0;color:#fff;font-size:17px;font-weight:800;width:100%;padding:13px}
.p:disabled{opacity:.45}
input{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:rgba(127,127,127,.12);color:var(--ink);text-align:center;margin-bottom:10px}
.am{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.am button{padding:8px 2px;font-size:12px;line-height:1.35}
.am b{font-size:20px;display:block}
#slots{font-size:28px;margin:8px 0;min-height:40px}
.ds{text-align:left;font-size:13px;color:var(--mute);line-height:1.6;margin:6px 0 10px}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700;margin-bottom:8px}
#cv{width:100%;height:auto;touch-action:none;border-radius:14px;display:block;border:1px solid var(--line)}
.big{font-size:42px;font-weight:800;color:var(--gold);margin:6px 0}
.row{display:flex;justify-content:space-between;padding:8px 10px;border-radius:10px;background:rgba(127,127,127,.12);margin:5px 0;font-size:15px}
.acts{display:grid;gap:10px;margin-top:12px}
#box{width:100%;height:140px;margin-top:8px;border-radius:10px;border:1px solid var(--line);background:rgba(127,127,127,.12);color:var(--ink);font:13px inherit;font-family:inherit;padding:8px}
details.man{margin:8px 0 10px;text-align:left}details.man summary{cursor:pointer;font-weight:700;color:var(--gold);padding:6px 0}
#skill{display:none;margin-top:10px;padding:20px;font-size:20px;touch-action:manipulation}
@media (pointer:coarse){#skill{display:block}}
.logo{display:inline-block;font-size:44px;line-height:1;animation:hop 1.6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px) rotate(-6deg)}}
h1{background:linear-gradient(90deg,#ffd86b,#ff9a3c);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;margin:2px 0 4px}
.sub{color:var(--mute);font-size:14px;margin:0 0 10px}
body{background:radial-gradient(circle at 20% 0%,rgba(120,140,255,.28),transparent 55%),var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(2px 2px at 20% 30%,rgba(242,194,48,.55),transparent),radial-gradient(2px 2px at 70% 20%,rgba(255,255,255,.4),transparent),radial-gradient(1.5px 1.5px at 40% 78%,rgba(94,224,240,.55),transparent),radial-gradient(2px 2px at 86% 64%,rgba(255,122,184,.45),transparent);animation:dust 7s ease-in-out infinite alternate}
@keyframes dust{from{transform:translateY(0)}to{transform:translateY(-16px)}}
body>*{position:relative;z-index:1}
.card{box-shadow:0 10px 30px rgba(0,0,0,.28)}
.p{box-shadow:0 6px 0 #9b3410,0 12px 20px rgba(0,0,0,.3)}
.p:active{transform:translateY(4px);box-shadow:0 2px 0 #9b3410}
.p:disabled{box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 12px}
.chip{background:rgba(127,127,127,.14);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.am button:nth-child(1){border-bottom:4px solid #e53935}.am button:nth-child(2){border-bottom:4px solid #2f80ff}.am button:nth-child(3){border-bottom:4px solid #ffd23a}.am button:nth-child(4){border-bottom:4px solid #2b2b2b}.am button:nth-child(5){border-bottom:4px solid #bbb}
#cv{box-shadow:0 8px 24px rgba(0,0,0,.35)}
.hud button{padding:4px 10px;font-size:16px;border-radius:999px}
.am button:nth-child(6){border-bottom:4px solid #8d6e63}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><span class="logo">🐰</span><h1>ล่าอูนา</h1><p class="sub">ยิงกระสุน ล้มอูนา เก็บเหรียญ</p></header>

<div id="s1" class="card">
  <div class="chips"><span class="chip">🎯 กระสุน 3 นัด</span><span class="chip">🌀 ด่านสุ่มทุกครั้ง</span><span class="chip" id="cchip"></span></div>
  <input id="nm" maxlength="20" placeholder="ใส่ชื่อของคุณ" aria-label="ชื่อผู้เล่น">
  <div class="am" id="amb"></div>
  <div id="slots"></div>
  <details class="man"><summary>📖 คู่มือ (กดเพื่ออ่าน)</summary><div class="ds" id="ds"></div></details>
  <button id="clr" onclick="clearPick()">ล้างกระสุนที่เลือก</button>
  <button class="p" id="go" style="margin-top:10px" onclick="startGame()" disabled>🎯 สุ่มด่านและเริ่ม!</button>
  <div id="cd" class="mu"></div>
</div>

<div id="s2" hidden>
  <div class="hud"><span id="ammo"></span><span><button id="mu" onclick="tg()" aria-label="เสียง">🔊</button> 💰 <span id="coins">0</span></span></div>
  <canvas id="cv" width="800" height="480"></canvas>
  <button id="skill" class="p" disabled>⚡ สกิล</button>
  <p id="st"></p>
</div>

<div id="s3" class="card" hidden>
  <div id="rn" style="font-weight:700;font-size:18px"></div>
  <div class="big" id="tot"></div>
  <div id="list"></div>
  <div class="acts">
    <button id="snd" class="p" onclick="sendHook()" hidden>📨 ส่งผลเข้าห้อง Discord</button>
    <button class="p" onclick="copySum()">📋 คัดลอกสรุป ไปวางในแชท</button>
    <button onclick="again()">เล่นอีกครั้ง</button>
  </div>
  <div id="cmsg" class="mu"></div>
  <textarea id="box" hidden readonly></textarea>
</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
// ===== ตั้งค่า (ปรับตัวเลขตรงนี้ได้) =====
var COOL=6;                       // คูลดาวน์ (ชั่วโมง) 0 = ไม่มี (ใส่ 0 ตอนทดสอบ) นับตั้งแต่กดเริ่มเล่น
var BLOCK_HP=100;                 // เลือดของกระจก/ไม้/หิน
var PIERCE_KEEP=.5;               // ทะลุสิ่งกีดขวาง 1 ชิ้น พลังกระสุนเหลือเท่าไร (ยกเว้นสีเหลือง) 1 = ไม่ลด
var BOOM_R=70;                    // รัศมีระเบิดกระสุนดำ (พิกเซล) ปรับได้ตรงนี้
var N_UNA=3;                      // จำนวนอูนาต่อด่าน
var AM={
  red:{id:'red',n:'แดง',e:'🔴',c:'#e53935',dmg:500,pen:1,ab:'ไม่มีความสามารถ',ar:'เจาะเกราะเบา'},
  blue:{id:'blue',n:'ฟ้า',e:'🔵',c:'#2f80ff',dmg:200,pen:1,ab:'แตะ: แตกเป็น 3 นัด',ar:'เจาะเกราะเบา'},
  yellow:{id:'yellow',n:'เหลือง',e:'🟡',c:'#ffd23a',dmg:200,pen:2,ab:'แตะ: พุ่งเร็ว +50 ดาเมจเบา',ar:'เจาะเกราะกลาง'},
  black:{id:'black',n:'ดำ',e:'⚫',c:'#2b2b2b',dmg:10,dd:'100',pen:3,ab:'แตะ: ระเบิดวงกว้าง',ar:'เจาะ Anti-Tank'},
  white:{id:'white',n:'ขาว',e:'⚪',c:'#ffffff',dmg:10,dd:'10000',drop:10000,pen:1,ab:'แตะ: ปล่อยกระสุนทิ้งแนวดิ่ง (แคบมาก เจาะทะลุแนวดิ่ง)',ar:'เจาะเกราะเบา'},
  eagle:{id:'eagle',n:'อินทรี',e:'🦅',c:'#8d6e63',dmg:0,dd:'500',pen:3,ab:'แตะ: เรียกอินทรีโฉบลง (ไม่แตะ = โผล่เองเมื่อปลาชน)',ar:'เจาะ Anti-Tank · เลือกแล้วได้นัดเดียว'}
};
var ORDER=['red','blue','yellow','black','white','eagle'];
var MAT={glass:{n:'กระจก',c:'#9ed8ff',arm:1,den:.0012,cut:.5},wood:{n:'ไม้',c:'#b07a3f',arm:2,den:.0018,cut:.7},stone:{n:'หิน',c:'#8a8f98',arm:3,den:.0026,cut:.95}};
var UNA={
  n:{name:'อูนาธรรมดา',hp:300,r:18,rw:[30,100],w:50},
  h:{name:'อูนาใส่หมวก',hp:500,r:19,rw:[40,200],w:30},
  k:{name:'อูนาราชา',hp:1000,r:21,rw:[100,500],w:19},
  x:{name:'อูนาราชัน',hp:3000,r:30,rw:[3000,3000],w:1}
};
// =====================================
var M=Matter,Engine=M.Engine,Bodies=M.Bodies,Body=M.Body,Composite=M.Composite,Events=M.Events;
var CW=800,CH=480,GY=450,AX=115,AY=372,STEP=1000/60;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var eng,world,picks=[],shotIdx=0,projs=[],dead=[],parts=[],pops=[],bombs=[];
var phase='setup',steps=0,waitT=0,live=false,drag=false,pull={x:AX,y:AY},coins=0,kills=[],running=false,acc=0,lastT=0,stamp='',player='';
function $(i){return document.getElementById(i)}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function bodies(){return Composite.allBodies(world)}
function alive(k){return bodies().some(function(b){return b.g===k&&!b.dead})}

// ---------- เสียง / เอฟเฟกต์ ----------
var sndOn=true,ac=null;
function initAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.resume)ac.resume()}catch(e){ac=null}}
function tone(f,d,type,vol,when,slide){
  if(!sndOn||!ac)return;
  try{var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(when||0);
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
    g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}
}
function noise(d,vol,when,hp){
  if(!sndOn||!ac)return;
  try{var n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0),i;
    for(i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
    var s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();
    s.buffer=b;f.type='highpass';f.frequency.value=hp||800;g.gain.value=vol||.2;
    s.connect(f);f.connect(g);g.connect(ac.destination);s.start(ac.currentTime+(when||0))}catch(e){}
}
var SFX={
  click:function(){tone(660,.05,'triangle',.1)},
  pick:function(){tone(520,.06,'triangle',.12);tone(780,.08,'triangle',.1,.05)},
  launch:function(){tone(220,.25,'sawtooth',.08,0,700);noise(.12,.1,0,1500)},
  glass:function(){noise(.18,.18,0,3000);tone(1800,.1,'sine',.08,0,900)},
  wood:function(){noise(.12,.2,0,500);tone(160,.1,'square',.08,0,80)},
  stone:function(){tone(90,.18,'sine',.25,0,50);noise(.1,.15,0,200)},
  una:function(){tone(700,.08,'square',.1);tone(500,.12,'square',.1,.07,250)},
  coin:function(){tone(988,.07,'square',.09);tone(1319,.2,'square',.09,.07)},
  split:function(){tone(500,.15,'triangle',.1,0,1200)},
  dash:function(){tone(300,.25,'sawtooth',.1,0,1400);noise(.15,.1,0,2000)},
  boom:function(){noise(.45,.35,0,60);tone(80,.4,'sine',.3,0,30)},
  drop:function(){tone(1200,.35,'sine',.1,0,300)},
  reload:function(){tone(400,.05,'square',.08);tone(300,.07,'square',.08,.08)},
  win:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.18,'triangle',.14,i*.12)})},
  lose:function(){tone(300,.3,'sawtooth',.12,0,120)},
  eagle:function(){tone(1500,.35,'sawtooth',.1,0,700);tone(900,.3,'square',.06,.05,500)}
};
function sfx(n){if(sndOn&&ac&&SFX[n])SFX[n]()}
function tg(){sndOn=!sndOn;var m=document.getElementById('mu');if(m)m.textContent=sndOn?'🔊':'🔇';if(sndOn)sfx('click')}
function jolt(){try{cv.animate([{transform:'translate(0,0)'},{transform:'translate(-7px,3px)'},{transform:'translate(6px,-4px)'},{transform:'translate(-3px,2px)'},{transform:'translate(0,0)'}],{duration:280});if(navigator.vibrate)navigator.vibrate(50)}catch(e){}}
document.getElementById('cchip').textContent=COOL?'⏳ เล่นได้ทุก '+COOL+' ชั่วโมง':'⏳ ไม่มีคูลดาวน์';

// ---------- หน้าเลือกกระสุน ----------
(function(){
  var h='',d='';
  ORDER.forEach(function(id){var a=AM[id];
    h+='<button onclick="pickAm(\''+id+'\')"><b>'+a.e+'</b>'+a.n+'<br>'+(a.dd||a.dmg)+'</button>';
    d+=a.e+' <b>'+a.n+'</b> ดาเมจ '+(a.dd||a.dmg)+' · '+a.ar+' · '+a.ab+'<br>';});
  $('amb').innerHTML=h;
  var mh='<b>วิธีเล่น</b><br>ลากกระสุนถอยหลังแล้วปล่อยเพื่อยิง ตอนกระสุนบินอยู่ แตะหน้าจอ (บนมือถือมีปุ่ม ⚡ ด้านล่าง) เพื่อใช้สกิล มีกระสุน 3 นัดต่อด่าน ด่านสุ่มใหม่ทุกครั้ง<br><br><b>กระสุน</b><br>'+d+'<br><b>สิ่งกีดขวาง (เลือด '+BLOCK_HP+' ทั้งหมด)</b><br>กระจก = เกราะเบา · ไม้ = เกราะกลาง · หิน = เกราะ Tank<br>กระสุนที่เจาะเกราะไม่ได้ จะทำดาเมจเหลือ 20%<br><br><b>อูนา</b><br>';
  for(var k in UNA){var u=UNA[k];mh+='🐰 '+u.name+' · เลือด '+u.hp+' · ได้ '+(u.rw[0]===u.rw[1]?u.rw[0]:u.rw[0]+'–'+u.rw[1])+' 🪙<br>'}
  $('ds').innerHTML=mh;
  renderSlots();
})();
function renderSlots(){
  var s='',i;
  for(i=0;i<3;i++)s+=(picks[i]?AM[picks[i]].e:'➕')+' ';
  $('slots').textContent=picks[0]==='eagle'?'🦅 (นัดเดียว)':s;$('go').disabled=!ready();
}
function ready(){return picks.length===3||(picks.length===1&&picks[0]==='eagle')}
function pickAm(id){initAudio();if(id==='eagle'){picks=['eagle']}else{if(picks[0]==='eagle')picks=[];if(picks.length>=3)return;picks.push(id)}renderSlots();sfx('pick')}
function clearPick(){picks=[];renderSlots();sfx('click')}
function cdLeft(){try{var l=+localStorage.getItem('lastHunt')||0;return Math.max(0,l+COOL*3600000-Date.now())}catch(e){return 0}}
function fmt(ms){var m=Math.ceil(ms/60000),h=Math.floor(m/60);return (h?h+' ชม. ':'')+(m%60)+' นาที'}
function showCd(){var l=cdLeft();$('cd').textContent=l>0?'⏳ เล่นได้อีกครั้งในอีก '+fmt(l):'';return l}
showCd();

// ---------- สร้างด่านสุ่ม ----------
function pickMat(){var r=Math.random();return r<.25?'glass':r<.6?'wood':'stone'}
function addBlock(x,y,w,h,m){
  var b=Bodies.rectangle(x,y,w,h,{density:MAT[m].den,friction:.7,restitution:.05});
  b.g='block';b.m=m;b.hp=BLOCK_HP;b.max=BLOCK_HP;b.flash=0;Composite.add(world,b);return b}
function addUna(x,y,k){
  var u=UNA[k],b=Bodies.circle(x,y,u.r,{density:.0025,friction:.6,restitution:.1});
  b.g='una';b.k=k;b.hp=u.hp;b.max=u.hp;b.rw=u.rw;b.flash=0;Composite.add(world,b)}
function rollUna(){
  var t=0,k,x;for(k in UNA)t+=UNA[k].w;x=Math.random()*t;
  for(k in UNA){x-=UNA[k].w;if(x<0)return k}return 'n'}
function buildLevel(){
  eng=Engine.create({positionIterations:12,velocityIterations:8});world=eng.world;eng.gravity.y=1;
  var gnd=Bodies.rectangle(600,GY+20,3000,40,{isStatic:true,friction:.9});gnd.g='ground';Composite.add(world,gnd);
  var xs=[490,610,730].sort(function(){return Math.random()-.5}).slice(0,rnd(2,3)),slots=[];
  xs.forEach(function(x){
    var base=GY,n=rnd(2,4),i;
    for(i=0;i<n;i++){
      addBlock(x-40,base-35.5,18,70,pickMat());addBlock(x+40,base-35.5,18,70,pickMat());
      slots.push([x,base-36]);
      addBlock(x,base-78,112,14,pickMat());
      base-=85.5;
    }
  });
  slots.sort(function(){return Math.random()-.5});
  for(var i=0;i<Math.min(N_UNA,slots.length);i++)addUna(slots[i][0],slots[i][1],rollUna());
  bodies().forEach(function(b){b.ox=b.position.x;b.oy=b.position.y});
}
// สร้างด่าน แล้วทดสอบว่าตั้งนิ่งจริง ถ้าพังหรือยังสั่นอยู่ จะสุ่มด่านใหม่ (สูงสุด 8 ครั้ง)
function newLevel(){
  var tries=0,ok=false,i;
  while(!ok&&tries<8){
    tries++;buildLevel();
    live=false;dead=[];steps=0;
    for(i=0;i<240;i++)Engine.update(eng,STEP);
    ok=true;
    bodies().forEach(function(b){
      if(b.isStatic)return;
      if(Math.hypot(b.position.x-b.ox,b.position.y-b.oy)>40||Math.hypot(b.velocity.x,b.velocity.y)>.15)ok=false;
    });
  }
  Events.on(eng,'collisionStart',onCol);
  live=true;steps=0;
}

// ---------- ดาเมจ ----------
function dmg(b,d,pen){
  if(b.dead||(b.g!=='block'&&b.g!=='una'))return false;
  var arm=b.g==='block'?MAT[b.m].arm:0;
  b.hp-=d*(pen>=arm?1:.2);b.flash=6;
  if(b.hp<=0){kill(b);return true}
  return false;
}
function kill(b){
  b.dead=true;dead.push(b);
  spark(b.position.x,b.position.y,b.g==='una'?'#fff':MAT[b.m].c);
  if(b.g==='block')sfx(b.m);
  if(b.g==='una'){
    var v=rnd(b.rw[0],b.rw[1]);coins+=v;kills.push({k:b.k,v:v});
    pops.push({t:'+'+v+' 🪙',x:b.position.x,y:b.position.y,l:60});hud();
    sfx('una');setTimeout(function(){sfx('coin')},180);jolt();
  }
}
function spark(x,y,c){for(var i=0;i<8;i++)parts.push({x:x,y:y,vx:Math.random()*6-3,vy:Math.random()*-5,l:30,c:c})}
function onCol(e){
  if(!live)return;
  e.pairs.forEach(function(pr){
    var a=pr.bodyA,b=pr.bodyB,p,o,s;
    if(a.g==='proj'||b.g==='proj'){
      p=a.g==='proj'?a:b;o=p===a?b:a;
      if(p.am.id==='eagle'&&!p.used&&o.g!=='proj'){callEagle(p);return}
      if(o.g==='ground'||o.g==='proj')return;
      if(p.hit[o.id]>steps-20)return;
      p.hit[o.id]=steps;
      var pw=p.pw||1,kd=dmg(o,p.am.dmg*pw,p.am.pen);
      if(!kd&&p.bonus)kd=dmg(o,p.bonus,1);   // ตอนพุ่งแล้ว +50 เป็นดาเมจเบา (เจาะเกราะเบา)
      if(kd){
        if(p.am.id!=='yellow')p.pw=pw*PIERCE_KEEP;   // ทะลุแล้วพลังลดลง (ยกเว้นสีเหลือง)
        var f=p.am.id==='yellow'?.85:.7;
        Body.setVelocity(p,{x:p.velocity.x*f,y:p.velocity.y*f});
      }
      return;
    }
    if(a.isStatic&&b.isStatic)return;
    s=Math.hypot(a.velocity.x-b.velocity.x,a.velocity.y-b.velocity.y);
    if(a.isStatic||b.isStatic){if(s>7)dmg(a.isStatic?b:a,(s-7)*10,3)}
    else if(s>5){var d=(s-5)*12;dmg(a,d,3);dmg(b,d,3)}
  });
}

// ---------- กระสุน ----------
function mkProj(x,y,vx,vy,am){
  var b=Bodies.circle(x,y,12,{density:.004,restitution:.3,friction:.5,frictionAir:0});
  b.g='proj';b.am=am;b.hit={};b.born=steps;b.used=false;b.slow=0;
  Body.setVelocity(b,{x:vx,y:vy});Composite.add(world,b);projs.push(b);return b}
function rm(b){b.dead=true;dead.push(b)}
// ---------- อินทรี: โฉบลงแล้วบินขึ้น ----------
var eagles=[],ER=46;
function eaglePos(e){var sx=e.tx-190,ex=e.tx+190,sy=Math.max(40,e.ty-250),by=Math.min(GY-30,Math.max(e.ty+40,150)),t=e.t;return{x:sx+(ex-sx)*t,y:sy+(by-sy)*(1-Math.pow(2*t-1,2))}}
function callEagle(p){p.used=true;eagles.push({tx:p.position.x,ty:p.position.y,t:0,hd:{},hu:{}});rm(p);sfx('eagle')}
function stepEagles(){
  eagles.forEach(function(e){
    e.t+=1/70;var q=eaglePos(e),set=e.t<.5?e.hd:e.hu;
    bodies().forEach(function(b){
      if(b.isStatic||b.dead||b.g==='proj'||set[b.id])return;
      var ex=Math.max(b.bounds.min.x-q.x,0,q.x-b.bounds.max.x),ey=Math.max(b.bounds.min.y-q.y,0,q.y-b.bounds.max.y);
      if(Math.hypot(ex,ey)<ER){set[b.id]=1;dmg(b,500,9);if(!b.dead)Body.setVelocity(b,{x:b.velocity.x+6,y:b.velocity.y+(e.t<.5?4:-6)})}
    });
  });
  eagles=eagles.filter(function(e){return e.t<1});
}
function useAb(p){
  if(p.used||p.dead)return;p.used=true;
  var t=p.am.id,vx=p.velocity.x,vy=p.velocity.y,x=p.position.x,y=p.position.y;
  if(t==='blue'){sfx('split');[-.22,.22].forEach(function(a){var c=Math.cos(a),s=Math.sin(a);var q=mkProj(x,y,vx*c-vy*s,vx*s+vy*c,p.am);q.used=true;q.pw=p.pw})}
  else if(t==='yellow'){sfx('dash');Body.setVelocity(p,{x:vx*1.9,y:vy*1.9});p.bonus=50}
  else if(t==='black'){
    var R=BOOM_R;
    bodies().forEach(function(b){
      if(b.isStatic||b.dead||b===p||b.g==='proj')return;
      var ex=Math.max(b.bounds.min.x-x,0,x-b.bounds.max.x),ey=Math.max(b.bounds.min.y-y,0,y-b.bounds.max.y);
      if(Math.hypot(ex,ey)<R){
        var d=Math.hypot(b.position.x-x,b.position.y-y);
        dmg(b,100,9);
        if(!b.dead&&d>1)Body.setVelocity(b,{x:b.velocity.x+(b.position.x-x)/d*7,y:b.velocity.y+(b.position.y-y)/d*7-2});
      }
    });
    sfx('boom');jolt();spark(x,y,'#ff9a3c');bombs.push({x:x,y:y,t:-99,boom:1,l:14});rm(p);
  }
  else if(t==='eagle'){callEagle(p)}
  else if(t==='white'){
    var P=p.am.drop;   // พลังกระสุนทิ้ง ลดเป็นเปอร์เซ็นตามวัสดุที่ผ่าน (cut ใน MAT)
    bodies().filter(function(b){return !b.isStatic&&!b.dead&&b!==p&&b.g!=='proj'&&b.bounds.min.x<x+3&&b.bounds.max.x>x-3&&b.bounds.max.y>y})
      .sort(function(a,b){return a.position.y-b.position.y})
      .forEach(function(b){
        P=P*(b.g==='block'?1-MAT[b.m].cut:1);
        dmg(b,P,9);
      });
    bombs.push({x:x,y:y,t:0,l:18});rm(p);sfx('drop');setTimeout(function(){sfx('boom');jolt()},320);
  }
}

// ---------- เริ่ม/จบเกม ----------
function startGame(){
  if(showCd()>0||!ready())return;
  initAudio();sfx('click');
  try{localStorage.setItem('lastHunt',Date.now())}catch(e){}
  player=$('nm').value.trim()||'ไม่ระบุชื่อ';
  coins=0;kills=[];shotIdx=0;projs=[];parts=[];pops=[];bombs=[];eagles=[];
  newLevel();
  $('s1').hidden=true;$('s3').hidden=true;$('s2').hidden=false;
  phase='aim';hud();st();
  running=true;lastT=performance.now();acc=0;requestAnimationFrame(loop);
}
function hud(){
  $('coins').textContent=coins;
  $('ammo').innerHTML=picks.map(function(id,i){return '<span style="opacity:'+(i<shotIdx?.25:1)+'">'+AM[id].e+'</span>'}).join(' ');
}
function sk(){
  var b=$('skill'),can=phase==='fly'&&projs.some(function(p){return !p.used&&!p.dead&&p.am.id!=='red'});
  b.disabled=!can;
  b.textContent=phase==='fly'&&picks[shotIdx-1]?'⚡ '+AM[picks[shotIdx-1]].ab.replace('แตะ: ',''):'⚡ สกิล (ใช้ตอนกระสุนบิน)';
}
function st(){
  sk();
  $('st').textContent=phase==='aim'?'ลากกระสุนถอยหลังแล้วปล่อยเพื่อยิง · ตอนบินอยู่ แตะหน้าจอเพื่อใช้ความสามารถ':phase==='fly'?'แตะเพื่อใช้ความสามารถ ('+AM[picks[shotIdx-1]].ab+')':'กำลังรีโหลดกระสุน...';
}
function endGame(){
  phase='end';running=false;sfx(kills.length?'win':'lose');
  try{localStorage.setItem('lastHunt',Date.now())}catch(e){}
  stamp=Math.floor(Date.now()/1000).toString(36);
  $('s2').hidden=true;$('s3').hidden=false;
  $('rn').textContent='🐰 '+player;
  $('tot').textContent='💰 '+coins.toLocaleString('en-US')+' เหรียญ';
  var h='',c={};
  kills.forEach(function(k){c[k.k]=(c[k.k]||0)+1});
  for(var k in c)h+='<div class="row"><span>🐰 '+UNA[k].name+'</span><span>× '+c[k]+'</span></div>';
  if(!kills.length)h='<div class="row"><span>ไม่ได้ล้มอูนาเลย</span><span>😢</span></div>';
  h+='<div class="row"><span>กระสุน</span><span>'+picks.map(function(i){return AM[i].e}).join(' ')+'</span></div>';
  $('list').innerHTML=h;$('cmsg').textContent='';$('box').hidden=true;
  var sb=$('snd');sb.hidden=!hasHook();sb.disabled=false;sb.textContent='📨 ส่งผลเข้าห้อง Discord';
}
function again(){picks=[];renderSlots();$('s3').hidden=true;$('s1').hidden=false;showCd()}

// ---------- ลูปเกม ----------
function loop(t){
  if(!running)return;
  acc+=Math.min(50,t-lastT);lastT=t;
  while(acc>=STEP){step();acc-=STEP}
  draw();requestAnimationFrame(loop);
}
function step(){
  steps++;Engine.update(eng,STEP);stepEagles();
  dead.forEach(function(b){Composite.remove(world,b)});dead=[];
  bodies().forEach(function(b){
    if(b.isStatic)return;
    if(b.flash>0)b.flash--;
    if(b.position.y>CH+120||b.position.x>1300||b.position.x<-200){b.dead=true;dead.push(b)}
  });
  if(phase==='fly'){
    projs=projs.filter(function(b){
      if(b.dead)return false;
      b.slow=(Math.hypot(b.velocity.x,b.velocity.y)<.4&&b.position.y>GY-30)?b.slow+1:0;
      if(b.slow>60||steps-b.born>720){rm(b);return false}
      return true;
    });
    if(!projs.length){phase='wait';waitT=0;st()}
  }else if(phase==='wait'){
    waitT++;
    var calm=bodies().every(function(b){return b.isStatic||Math.hypot(b.velocity.x,b.velocity.y)<.35});
    if(waitT>90&&(calm||waitT>420)){
      if(!alive('una')||shotIdx>=picks.length)endGame();else{phase='aim';st();sfx('reload')}
    }
  }
}

// ---------- ควบคุม ----------
function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*CW/r.width,y:(e.clientY-r.top)*CH/r.height}}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();var p=pos(e);
  if(phase==='aim'&&Math.hypot(p.x-AX,p.y-AY)<80){drag=true;pull={x:AX,y:AY};try{cv.setPointerCapture(e.pointerId)}catch(x){}}
  else if(phase==='fly'){projs.slice().forEach(useAb);sk()}
});
cv.addEventListener('pointermove',function(e){
  if(!drag)return;var p=pos(e),dx=p.x-AX,dy=p.y-AY,d=Math.hypot(dx,dy),s=d>100?100/d:1;
  pull={x:AX+dx*s,y:AY+dy*s};
});
function release(e){
  if(!drag)return;drag=false;
  var vx=(AX-pull.x)*.14,vy=(AY-pull.y)*.14;
  if(Math.hypot(AX-pull.x,AY-pull.y)<15||phase!=='aim')return;
  mkProj(AX,AY,vx,vy,AM[picks[shotIdx]]);shotIdx++;phase='fly';hud();st();sfx('launch');
}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',function(){drag=false});

$('skill').addEventListener('pointerdown',function(e){e.preventDefault();if(phase==='fly'){projs.slice().forEach(useAb);sk()}});

// ---------- วาด ----------
function disc(x,y,r,c){
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle='#0009';ctx.stroke();
  ctx.fillStyle=c==='#2b2b2b'?'#fff':'#000';ctx.beginPath();ctx.arc(x+r*.35,y-r*.2,r*.2,0,6.2832);ctx.fill();
}
function draw(){
  var g=ctx,i,s=g.createLinearGradient(0,0,0,GY);
  s.addColorStop(0,'#7ec8ff');s.addColorStop(1,'#dff3ff');g.fillStyle=s;g.fillRect(0,0,CW,CH);
  g.fillStyle='#6fbf5a';g.fillRect(0,GY,CW,12);g.fillStyle='#8a5a2b';g.fillRect(0,GY+12,CW,CH-GY-12);
  g.fillStyle='#6b3f1d';g.fillRect(AX-5,AY+12,10,GY-AY-12);
  var bx=drag?pull.x:AX,by=drag?pull.y:AY;
  if(drag&&phase==='aim'&&picks[shotIdx]){
    var px=AX,py=AY,vx=(AX-pull.x)*.14,vy=(AY-pull.y)*.14;
    g.fillStyle='#fff9';
    for(i=0;i<60;i++){px+=vx;py+=vy;vy+=.2778;if(i%3===0){g.beginPath();g.arc(px,py,3,0,6.2832);g.fill()}if(py>GY)break}
  }
  g.strokeStyle='#3b1f0b';g.lineWidth=5;g.beginPath();g.moveTo(AX-8,AY);g.lineTo(bx,by);g.lineTo(AX+8,AY);g.stroke();
  if(phase==='aim'&&picks[shotIdx]){if(picks[shotIdx]==='eagle'){g.font='30px serif';g.textAlign='center';g.textBaseline='middle';g.fillText('🐟',bx,by)}else disc(bx,by,12,AM[picks[shotIdx]].c)}
  bodies().forEach(function(b){
    if(b.g==='block'){
      g.globalAlpha=(b.m==='glass'?.55:.75)+.25*Math.max(0,b.hp)/b.max;
      g.fillStyle=MAT[b.m].c;g.beginPath();g.moveTo(b.vertices[0].x,b.vertices[0].y);
      for(var j=1;j<b.vertices.length;j++)g.lineTo(b.vertices[j].x,b.vertices[j].y);
      g.closePath();g.fill();g.globalAlpha=1;g.lineWidth=2;g.strokeStyle=b.flash>0?'#fff':'#0007';g.stroke();
    }else if(b.g==='proj'){if(b.am.id==='eagle'){g.font='30px serif';g.textAlign='center';g.textBaseline='middle';g.fillText('🐟',b.position.x,b.position.y)}else disc(b.position.x,b.position.y,12,b.am.c)}
    else if(b.g==='una'){
      var u=UNA[b.k],r=u.r,x=b.position.x,y=b.position.y;
      if(b.k==='x'){g.fillStyle='rgba(255,40,40,.35)';g.beginPath();g.arc(x,y,r+10,0,6.2832);g.fill()}
      g.textAlign='center';g.textBaseline='middle';g.font=(r*1.9)+'px serif';
      g.globalAlpha=b.flash>0?.5:1;g.fillText('🐰',x,y);g.globalAlpha=1;
      if(b.k==='h'){g.font=(r*1.1)+'px serif';g.fillText('🎩',x,y-r*.95)}
      if(b.k==='k'){g.font=(r*1.2)+'px serif';g.fillText('💎',x,y-r*.95)}
      if(b.k==='x'){g.font=(r*1.1)+'px serif';g.fillText('👑',x,y-r*.95)}
      var w=Math.max(36,r*2);g.fillStyle='#000a';g.fillRect(x-w/2,y-r-22,w,7);
      g.fillStyle='#e53935';g.fillRect(x-w/2+1,y-r-21,(w-2)*Math.max(0,b.hp)/b.max,5);
    }
  });
  bombs.forEach(function(b){
    if(b.boom){g.fillStyle='rgba(255,170,60,'+b.l/20+')';g.beginPath();g.arc(b.x,b.y,BOOM_R*(1-b.l/16),0,6.2832);g.fill();b.l--}
    else{b.t++;var yy=b.y+(GY-b.y)*Math.min(1,b.t/b.l);g.fillStyle='#fff7';g.fillRect(b.x-1.5,b.y,3,yy-b.y);disc(b.x,yy,5,'#ffffff')}
  });
  bombs=bombs.filter(function(b){return b.boom?b.l>0:b.t<b.l+8});
  eagles.forEach(function(e){var q=eaglePos(e);g.globalAlpha=.92;g.textAlign='center';g.textBaseline='middle';g.font='110px serif';g.fillText('🦅',q.x,q.y);g.globalAlpha=1});
  parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.l--;g.fillStyle=p.c;g.fillRect(p.x,p.y,5,5)});
  parts=parts.filter(function(p){return p.l>0});
  pops.forEach(function(p){p.y-=.7;p.l--;g.globalAlpha=Math.min(1,p.l/20);g.font='bold 22px sans-serif';g.textAlign='center';g.fillStyle='#ffd23a';g.strokeStyle='#000';g.lineWidth=3;g.strokeText(p.t,p.x,p.y);g.fillText(p.t,p.x,p.y);g.globalAlpha=1});
  pops=pops.filter(function(p){return p.l>0});
}

// ---------- สรุปผล / ส่ง Webhook ----------
function H(s){var h=2166136261,i;s='gold-secret-7Qx'+s;for(i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function sumText(){
  var d=new Date(parseInt(stamp,36)*1000).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});
  var c={},s='🐰 ผลล่าอูนา: '+player+'\n💰 ได้ '+coins.toLocaleString('en-US')+' เหรียญ\n🎯 กระสุน: '+picks.map(function(i){return AM[i].e}).join(' ')+'\n';
  kills.forEach(function(k){c[k.k]=(c[k.k]||0)+1});
  for(var k in c)s+='🐰 '+UNA[k].name+' ×'+c[k]+'\n';
  return s+'🕒 '+d+'\n🔒 รหัส: '+stamp+'-'+H(player+'|'+coins+'|'+stamp);
}
function copySum(){
  var s=sumText(),b=$('box');
  function fb(){b.value=s;b.hidden=false;b.focus();b.select();$('cmsg').textContent='กดค้างที่ข้อความด้านล่าง แล้วเลือก คัดลอก ครับ'}
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(function(){$('cmsg').textContent='คัดลอกแล้ว! ไปวางในช่องแชทได้เลย'},fb)}else fb();
  }catch(e){fb()}
}
function hasHook(){return typeof WEBHOOK_URL==='string'&&/^https:\/\/(discord|discordapp)\.com\/api\/webhooks\//.test(WEBHOOK_URL)}
function sendHook(){
  var b=$('snd');
  if(b.disabled||!hasHook())return;
  b.disabled=true;b.textContent='กำลังส่ง...';
  fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'ล่าอูนา',content:sumText(),allowed_mentions:{parse:[]}})})
    .then(function(r){if(!r.ok)throw new Error(r.status);b.textContent='✅ ส่งเข้าห้องแล้ว!'})
    .catch(function(){b.disabled=false;b.textContent='❌ ส่งไม่สำเร็จ กดลองใหม่'});
}
